<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visor Casinos Colombia - Ingreso</title>
  <link rel="stylesheet" href="/public/css/estilo.css" />
</head>
<body>
  <div class="login-wrap">
    <form class="login-card" id="form-login" autocomplete="off">
      <img class="login-logo" src="/public/logo.png" alt="Logo" />
      <h1>Visor Casinos</h1>
      <div class="sub">Establecimientos autorizados - Colombia</div>

      <div class="campo">
        <label for="usuario">Usuario</label>
        <input id="usuario" name="usuario" type="text" required placeholder="Ingrese su usuario" />
      </div>

      <div class="campo">
        <label for="clave">Contraseña</label>
        <input id="clave" name="clave" type="password" required placeholder="••••••••" />
      </div>

      <button class="btn btn-block" type="submit">Ingresar</button>
      <div class="error-msg" id="error"></div>

      <div class="login-hint">
        Accesos de demostración:<br />
        <strong>admin</strong> / admin123 (gestiona usuarios)<br />
        <strong>visitante</strong> / visita123 (solo consulta)
      </div>
    </form>
  </div>
  <script src="/public/js/login.js"></script>
</body>
</html>
